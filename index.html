<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ZAREN — Luxury Perfume. BE REMEMBERED." />
  <title>ZAREN — BE REMEMBERED.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== LOADER ===== -->
  <div id="loader" class="loader">
    <div class="loader-content">
      <div class="loader-mark">ZAREN</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <header id="header" class="header">
    <div class="header-inner">
      <a href="#hero" class="logo" aria-label="ZAREN">
        <span class="logo-text">ZAREN</span>
      </a>
      <nav class="nav-desktop" aria-label="Main navigation">
        <a href="#collection" data-i18n="nav_collection"></a>
        <a href="#story" data-i18n="nav_story"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>
      <div class="header-actions">
        <button id="langToggle" class="lang-toggle" aria-label="Switch language">
          <span class="lang-icon">🌐</span>
          <span id="langLabel">EN</span>
        </button>
        <button id="menuToggle" class="menu-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <nav id="mobileNav" class="nav-mobile" aria-label="Mobile navigation">
      <a href="#collection" data-i18n="nav_collection"></a>
      <a href="#story" data-i18n="nav_story"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
  </header>

  <!-- ===== HERO ===== -->
  <section id="hero" class="hero">
    <div class="hero-bg" id="heroBg">
      <div class="hero-glow"></div>
      <div class="hero-particles" id="particles"></div>
    </div>
    <div class="hero-content" id="heroContent">
      <div class="hero-text">
        <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 class="hero-title">ZAREN</h1>
        <p class="hero-tagline" data-i18n="hero_tagline"></p>
        <div class="hero-cta">
          <a href="#collection" class="btn btn-gold" data-i18n="hero_cta"></a>
          <a href="#story" class="btn btn-ghost" data-i18n="hero_cta2"></a>
        </div>
      </div>
      <div class="hero-bottle-scene" id="bottleScene">
        <div class="bottle-3d" id="heroBottle">
          <div class="bottle-face bottle-front">
            <div class="bottle-shape">
              <div class="bottle-cap"></div>
              <div class="bottle-neck"></div>
              <div class="bottle-body">
                <div class="bottle-label">
                  <span class="bottle-label-text">ZAREN</span>
                  <span class="bottle-label-sub">PARIS</span>
                </div>
                <div class="bottle-liquid"></div>
                <div class="bottle-shine"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="bottle-shadow"></div>
      </div>
    </div>
    <div class="scroll-hint">
      <span class="scroll-hint-text" data-i18n="scroll_hint"></span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- ===== BRAND VALUES ===== -->
  <section class="values section-reveal">
    <div class="container">
      <div class="values-grid">
        <div class="value-card">
          <div class="value-icon">✦</div>
          <h3 data-i18n="value1_title"></h3>
          <p data-i18n="value1_desc"></p>
        </div>
        <div class="value-card">
          <div class="value-icon">❖</div>
          <h3 data-i18n="value2_title"></h3>
          <p data-i18n="value2_desc"></p>
        </div>
        <div class="value-card">
          <div class="value-icon">◈</div>
          <h3 data-i18n="value3_title"></h3>
          <p data-i18n="value3_desc"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== COLLECTION ===== -->
  <section id="collection" class="collection section-reveal">
    <div class="container">
      <div class="section-head">
        <p class="section-eyebrow" data-i18n="collection_eyebrow"></p>
        <h2 class="section-title" data-i18n="collection_title"></h2>
        <p class="section-sub" data-i18n="collection_sub"></p>
      </div>
      <div class="products-grid" id="productsGrid">
        <!-- Products injected by JS -->
      </div>
    </div>
  </section>

  <!-- ===== BRAND STORY ===== -->
  <section id="story" class="story section-reveal">
    <div class="container">
      <div class="story-grid">
        <div class="story-text">
          <p class="section-eyebrow" data-i18n="story_eyebrow"></p>
          <h2 class="section-title" data-i18n="story_title"></h2>
          <p class="story-body" data-i18n="story_body1"></p>
          <p class="story-body" data-i18n="story_body2"></p>
          <p class="story-signature" data-i18n="story_sig"></p>
        </div>
        <div class="story-visual">
          <div class="story-circle">
            <div class="story-circle-inner">
              <span class="story-circle-text">ZAR</span>
              <span class="story-circle-sub" data-i18n="story_circle_sub"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->

    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="footer-logo">ZAREN</span>
          <p class="footer-tagline" data-i18n="footer_tagline"></p>
        </div>
        <div class="footer-links">
          <a href="#collection" data-i18n="nav_collection"></a>
          <a href="#story" data-i18n="nav_story"></a>
          <a href="#contact" data-i18n="nav_contact"></a>
        </div>
        <div class="footer-social">

  <!-- ===== MUSIC CONTROL ===== -->
  <div id="musicPrompt" class="music-prompt" hidden>
    <div class="music-prompt-card">
      <p class="music-prompt-text" data-i18n="music_prompt"></p>
      <div class="music-prompt-buttons">
        <button id="musicPlayBtn" class="btn btn-gold btn-sm" data-i18n="music_play"></button>
        <button id="musicDeclineBtn" class="btn btn-ghost btn-sm" data-i18n="music_decline"></button>
      </div>
    </div>
  </div>

  <button id="musicControl" class="music-control" hidden aria-label="Music control">
    <svg id="musicIconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="musicIconPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <!-- ===== PRODUCT MODAL ===== -->
  <div id="productModal" class="modal" hidden>
    <div class="modal-overlay" data-close="modal"></div>
    <div class="modal-content" id="modalContent">
      <button class="modal-close" data-close="modal" aria-label="Close">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
